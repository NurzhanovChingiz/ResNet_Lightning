[project]
name = "resnet-lightning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "kagglehub>=1.0.2",
    "lightning>=2.6.6",
    "rocm-sdk-core==7.13.0",
    "rocm-sdk-libraries-gfx1151==7.13.0",
    "rocm[libraries]==7.13.0",
    "scikit-learn>=1.9.1",
    "torch==2.11.0+rocm7.13.0",
    "torchaudio==2.11.0+rocm7.13.0",
    "torchmetrics>=1.9.0",
    "torchvision==0.26.0+rocm7.13.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "amd-rocm-gfx1151"
url = "https://repo.amd.com/rocm/whl/gfx1151/"

[[tool.uv.dependency-metadata]]
name = "rocm"
version = "7.13.0"
requires-dist = [
    "rocm-sdk-core==7.13.0",
    "rocm-sdk-libraries-gfx1151==7.13.0 ; extra == 'libraries'",
]
provides-extra = ["libraries"]

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
module = [
    "kagglehub",
    "kagglehub.*",
    "sklearn.*",
    "torchvision.*",
]
ignore_missing_imports = true

[tool.ruff.lint]
extend-ignore = ["E501","PLR0913", "PLR2004", "PLR0912", "PLW2901", "COM812"]
select = [
  "UP",   # pyupgrade
  "D",    # pydocstyle
  "I",    # isort
  "E",    # flake8-errors
  "W",    # flake8-warnings
  "Q",    # flake8-quotes
  "F",    # flake8-pyflakes
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "S",    # flake8-bandit
  "RSE",  # flake8-raise
  "BLE",  # flake8-blind-except
  "T10",  # flake8-debugger
  "SIM",  # flake8-simplify
  "EM",   # flake8-errmsg
  "T20",  # flake8-print
  "FBT",  # flake8-boolean-trap
  "COM",  # flake8-commas
  "DTZ",  # flake8-datetimez
  "FIX",  # flake8-fixme
  "INT",  # flake8-gettext
  "FA",   # flake8-future-annotations
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "G",    # flake8-logging-format
  "INP",  # flake8-no-pep420
  "PIE",  # flake8-pie
  "PT",   # flake8-pytest-style
  "RET",  # flake8-return
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "TID",  # flake8-tidy-imports
  "TC",   # flake8-type-checking
  "ARG",  # flake8-unused-arguments
  "PTH",  # flake8-use-pathlib
  "N",    # pep8-naming
  "PGH",  # pygrep-hooks
  "TRY",  # tryceratops
  "FLY",  # flynt
  "C90",  # mccabe
  "PD",   # pandas-vet
  "PL",   # Pylint
  "RUF",  # Ruff
  "ERA",  # eradicate
  "PERF", # Perflint
  "FURB", # refurb
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# smoke.py runs the fixed rocminfo binary and is a script, not a package module.
"docker/training/smoke.py" = ["S603", "INP001"]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true # check typed exception handlers

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "loguru>=0.7.3",
    "mutmut>=3.7.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-bdd>=8.1.0",
    "ruff>=0.15.19",
    "svcs>=26.1.0",
    "typer>=0.27.0",
    "xenon>=0.9.3",
]

test = [
    "behave>=1.3.3",
    "hypothesis>=6.168.0",
    "mutmut>=3.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

notebook = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.4",
]
